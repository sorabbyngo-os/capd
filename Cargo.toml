[package]
name    = "capd"
version = "0.1.0"
edition = "2021"
description = "Sorabbyngo capability token daemon"

[[bin]]
name = "capd"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
nix        = { version = "0.27", features = ["process", "socket"] }
log        = "0.4"
env_logger = "0.11"
